<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テストページ一覧</title>
<style>
:root{--bg:#e8f1f8;--card:#fff;--ink:#1d2b3a;--sub:#5b6b7b;--line:#c6d6e4}
@media (prefers-color-scheme:dark){:root{--bg:#101a24;--card:#192633;--ink:#eef3f8;--sub:#9fb0c0;--line:#2c3f52;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;padding:3vh 4vw}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:clamp(22px,4vh,32px);margin:0 0 1.5vh}
.bar{display:flex;gap:10px;margin-bottom:2vh}
input,button{font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input{flex:1;min-width:0}
button{cursor:pointer;font-weight:700}
a.item{display:block;padding:16px 18px;margin-bottom:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;font-size:clamp(17px,2.6vh,22px);font-weight:700;word-break:break-all}
a.item small{display:block;font-weight:400;color:var(--sub);font-size:.7em;margin-top:2px}
#msg{color:var(--sub);margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>テストページ一覧</h1>
<div class="bar"><input id="q" type="search" placeholder="さがす"><button id="re">こうしん</button></div>
<div id="msg">よみこみ中…</div>
<div id="list"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
let owner,repo,files=[];
if(P.get("repo")){[owner,repo]=P.get("repo").split("/")}
else if(location.hostname.endsWith(".github.io")){owner=location.hostname.split(".")[0];repo=location.pathname.split("/")[1]||owner+".github.io"}

function show(){
  const k=$("q").value.trim().toLowerCase(),L=$("list");
  L.textContent="";
  const v=files.filter(f=>f.name.toLowerCase().includes(k));
  v.forEach(f=>{
    const a=document.createElement("a");a.className="item";a.href=f.href;a.textContent=f.name;
    const s=document.createElement("small");s.textContent=f.path;a.appendChild(s);L.appendChild(a);
  });
  $("msg").textContent=v.length?"":"みつかりません";
}

async function load(force){
  if(!owner||!repo){$("msg").textContent="リポジトリが わかりません。URLのうしろに ?repo=ユーザー名/リポジトリ名 をつけてね";return}
  const key="tree:"+owner+"/"+repo;
  try{
    const c=JSON.parse(localStorage.getItem(key)||"null");
    if(c&&!force&&Date.now()-c.t<180000){files=c.f;show();return}
  }catch(_){}
  $("msg").textContent="よみこみ中…";
  try{
    const base="https://api.github.com/repos/"+owner+"/"+repo;
    const r=await fetch(base);
    if(!r.ok)throw new Error(r.status);
    const br=(await r.json()).default_branch;
    const t=await fetch(base+"/git/trees/"+encodeURIComponent(br)+"?recursive=1");
    if(!t.ok)throw new Error(t.status);
    const j=await t.json();
    files=j.tree
      .filter(e=>e.type==="blob"&&/\.html?$/i.test(e.path)&&e.path!=="index.html")
      .map(e=>{
        const idx=/(^|\/)index\.html$/i.test(e.path);
        const dir=e.path.replace(/\/?index\.html$/i,"");
        const href=(idx?dir:e.path).split("/").map(encodeURIComponent).join("/")+(idx?"/":"");
        return{name:idx?dir+"/":e.path,path:e.path,href};
      })
      .sort((a,b)=>a.name.localeCompare(b.name));
    try{localStorage.setItem(key,JSON.stringify({t:Date.now(),f:files}))}catch(_){}
    show();
    if(j.truncated)$("msg").textContent="ファイルが多すぎて、いちぶ表示できていません";
  }catch(e){
    $("msg").textContent=(e.message==="403"
      ?"GitHubの よみこみ回数の せいげんに ひっかかりました。しばらくしてから ためしてね"
      :"よみこめませんでした（"+e.message+"）。公開リポジトリか たしかめてね");
  }
}
$("q").oninput=show;
$("re").onclick=()=>load(true);
load(false);
</script>
</body>
</html>
